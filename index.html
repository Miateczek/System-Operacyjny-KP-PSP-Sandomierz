.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;background:var(--bg);color:var(--text)}.sidebar{background:#11151a;border-right:1px solid #2b323a;padding:22px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brand-icon{background:var(--site-primary);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px}.brand strong{display:block;font-size:14px}.brand small{display:block;color:#929ba6;margin-top:4px;font-size:11px}.nav-label{font-size:10px;letter-spacing:1.4px;color:#78818c;font-weight:800;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#aeb6c0;text-align:left;display:flex;gap:11px;align-items:center;padding:12px;border:1px solid transparent}.nav button:hover,.nav button.active{background:#282127;color:#fff;border-color:#4b292d}.nav button.active{box-shadow:inset 3px 0 var(--site-primary)}.nav .ico{width:20px;text-align:center}.side-bottom{margin-top:auto;border-top:1px solid #2b323a;padding:15px 7px 0}.userline{display:flex;align-items:center;gap:10px;margin-bottom:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#3b2428;color:#ffb7bb;font-weight:800}.userline strong{display:block;font-size:12px}.userline small{display:block;color:#9ba4ae;margin-top:3px}.content{min-width:0}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px;border-bottom:1px solid var(--border);background:var(--surface)}.crumb{font-size:13px;color:var(--muted)}.topright{display:flex;align-items:center;gap:10px}.live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;background:var(--green);border-radius:50%}.main{padding:30px;max-width:1500px;margin:auto}.eyebrow{font-size:11px;color:#e45b62;letter-spacing:1.6px;font-weight:800;text-transform:uppercase}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}.pagehead h1{font-size:calc(28px * var(--site-heading-scale));margin:7px 0 8px;letter-spacing:-.6px}.pagehead p{color:var(--muted);margin:0;line-height:1.5;font-size:14px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.stat,.panel,.module-card{background:var(--surface);border:1px solid var(--border);border-radius:calc(14px * var(--site-radius-scale));padding:19px;min-width:0}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:29px;margin:15px 0 5px}.stat small{color:var(--muted);font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section-head h2{font-size:16px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.module-card{padding:0;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}.module-card:hover{transform:translateY(-2px);border-color:#8a3b40}.module-cover{padding:19px 19px 12px;display:flex;align-items:center;justify-content:space-between}.module-icon{width:46px;height:46px;border-radius:13px;background:#322126;color:#ffb8bc;display:grid;place-items:center;font-size:24px}.arrow{color:var(--muted);font-size:20px}.module-body{padding:0 19px 19px}.module-body h3{margin:4px 0 7px;font-size:16px}.module-body p{color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 16px}.module-foot{border-top:1px solid var(--border);padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.tag{padding:5px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);font-size:10px;font-weight:800}.tag.red{background:#442126;color:#ffb7bb}.columns{grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr)}.vehicle-list{display:grid;gap:9px}.vehicle-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:12px}.vehicle-name{font-weight:800;font-size:12px}.vehicle-sub{font-size:11px;color:var(--muted);margin-top:5px}.vehicle-controls{display:flex;gap:8px;align-items:center}.vehicle-controls select{max-width:200px;padding:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:11px}.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--green);font-weight:800}.status-pill:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.status-pill.warn{color:var(--amber)}.status-pill.bad{color:var(--red)}.document-list{display:grid;gap:10px}.doc-row{padding:12px;border:1px solid var(--border);border-radius:9px;display:flex;justify-content:space-between;gap:12px;align-items:center}.doc-row strong{font-size:12px;display:block}.doc-row small{color:var(--muted);font-size:11px;display:block;margin-top:5px}.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px}.form-panel{max-width:1000px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-grid .span2{grid-column:span 2}.form-actions{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px;margin-top:8px}.notice{border-left:3px solid var(--site-primary);padding:12px 14px;background:var(--surface2);border-radius:0 8px 8px 0;color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:18px}.footnote{margin-top:20px;color:var(--muted);font-size:11px;line-height:1.6}.toast{position:fixed;right:22px;bottom:22px;background:#19251f;border:1px solid #2e6246;color:#b9f3d0;padding:13px 17px;border-radius:10px;box-shadow:0 10px 35px #0005;z-index:20;font-size:13px}.mobile-menu{display:none}
.form-grid .field.span2 > .grid label{padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text)!important;min-height:40px;cursor:pointer;transition:border-color .15s,background .15s}.form-grid .field.span2 > .grid label:hover{border-color:#8a3b40;background:#282127}.form-grid .field.span2 > .grid label input[type=checkbox]{accent-color:var(--site-primary);flex-shrink:0}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:210px minmax(0,1fr)}.main{padding:22px}.topbar{padding:0 22px}.columns{grid-template-columns:1fr}}
@media(max-width:720px){.shell{display:block}.sidebar{display:none}.topbar{height:62px;padding:0 16px}.mobile-menu{display:inline-block}.main{padding:18px 14px}.pagehead{flex-direction:column}.module-grid{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:24px}.form-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:span 1}.vehicle-row{grid-template-columns:1fr}.vehicle-controls select{max-width:none;flex:1}.auth-card{padding:23px}.live{display:none}}
@media(prefers-color-scheme:light){.sidebar{background:#15191e}}
</style>

<body>
<div id="app">
<section id="authView" class="auth-wrap">
 <div class="auth-card">
  <div class="crest">🚒</div><h1>KP PSP SANDOMIERZ</h1><p>Komenda Powiatowa Państwowej Straży Pożarnej w Sandomierzu<br>System dokumentacji i dyspozycji</p>
  <div class="tabs"><button id="loginTab" class="active" type="button">Logowanie</button><button id="registerTab" type="button">Rejestracja</button></div>
  <form id="authForm" novalidate>
   <div class="field hidden" id="registerNameField"><label for="registerName">IMIĘ I NAZWISKO</label><input id="registerName" autocomplete="name" placeholder="Wpisz imię i nazwisko"></div>
   <div class="field"><label for="username">LOGIN</label><input id="username" autocomplete="username" placeholder="Wpisz login" required></div>
   <div class="field"><label for="password">HASŁO</label><input id="password" type="password" autocomplete="current-password" placeholder="Wpisz hasło" required></div>
   <button id="authSubmit" class="primary full" type="submit">Zaloguj do systemu <span>→</span></button>
  </form>
  <div class="hint" id="authHint">Zaloguj się przy użyciu przypisanego konta służbowego.</div>
 </div>
</section>
<section id="appView" class="shell hidden">
 <aside class="sidebar">
  <div class="brand"><div class="brand-icon">🚒</div><div><strong>KP PSP SANDOMIERZ</strong><small>SYSTEM OPERACYJNY</small></div></div>
  <div><div class="nav-label">MENU GŁÓWNE</div><nav class="nav" id="sideNav">
   <button data-page="dashboard" class="active"><span class="ico">▦</span> Pulpit</button>
   <button data-page="dispatcher"><span class="ico">📟</span> Panel Dyżurnego</button>
   <button data-page="izz"><span class="ico">📋</span> Karta Zdarzenia IZZ</button>
   <button data-page="kpp"><span class="ico">🩺</span> Karta KPP</button>
   <button data-page="handover"><span class="ico">📄</span> Przekazaniowka</button>
   <button data-page="documents"><span class="ico">🗂️</span> Dokumenty</button>
  </nav></div>
  <div class="side-bottom"><div class="userline"><div class="avatar" id="avatar">U</div><div><strong id="sideUser">Użytkownik</strong><small id="sideRole">Strażak</small></div></div><button class="secondary full" onclick="signOut()">↪ Wyloguj</button></div>
 </aside>
  <div class="content"><header class="topbar"><div class="crumb"><button class="secondary small mobile-menu" onclick="toggleMobileNav()">☰</button> <span id="breadcrumb">Pulpit / Przegląd</span></div><div class="topright"><span class="tag red" id="topRole">STRAŻAK</span></div></header><main id="main" class="main"></main></div>
</section>
<div id="toast" class="toast hidden"></div>
</div>
<script>
const VEHICLES=[
 {id:'471[T]21',name:'Renault GBA-Rt 3/16',type:'GBA-Rt'},
 {id:'471[T]22',name:'Iveco GBA 2,5/16',type:'GBA'},
 {id:'471[T]25',name:'MAN GCBA 5,4/37',type:'GCBA'},
 {id:'471[T]51',name:'Iveco Eurocargo Magirus SD 37',type:'SD'},
 {id:'471[T]55',name:'Ford Transit SLBus',type:'SLBus'},
 {id:'471[T]90',name:'Ford Ranger SLRr',type:'SLRr'},
 {id:'479[T]66',name:'Scania P360 GCBA',type:'GCBA'}
];
const STATUS=['W BAZIE','WYJAZD DO ZDARZENIA','NA MIEJSCU','PRZEDYSPONOWANO','LOKALIZACJA / OPANOWANO','WYJAZD GOSPODARCZY','CZASOWO WYŁĄCZONY Z PODZIAŁU'];
// Osobne webhooki dla każdego rodzaju dokumentu.
const DISCORD_WEBHOOKS = {
 'Karta Zdarzenia IZZ': 'https://discord.com/api/webhooks/1544397789713141810/x0NCdgKYOS77Fvrgg-8WqaFf3bsUJpo28QpnTc1k8k2RQPFpZDyRKPhejlUNRb5zxVlZ',
 'Przekazaniowka': 'https://discord.com/api/webhooks/1544413846582853692/0-dPjgGvNgn0EHqNyilLQohfVRTFG3v1MBd9br1y2aBZ3wYBBPwIoTj7K1V9jYHW6xkD',
 'Karta KPP': 'https://discord.com/api/webhooks/1544415432734416976/IZeNrS3DflusSUFmztU76Nd7-n8drQ6UUY5l0CDQQkV1dGeVfelOiwclSTCaQwWcGvBL',
 'EWID-ST': 'https://discord.com/api/webhooks/1545877946257113150/k3_z7eZwSb1bJ7KHFedz8e16qDo0Ry_ssK7FnIzVK9AwhYd1EBCwucjS78YO3xHl7ZMC'
};
const DEFAULTS={}; VEHICLES.forEach(v=>DEFAULTS[v.id]='W BAZIE');
let currentUser={login:'Demo',name:'Użytkownik demonstracyjny',role:'Strażak-Ratownik'}; let authMode='login'; let page='dashboard'; let dispatcherLoggedIn=false;
const memoryStore={};
const read=(key,fallback)=>{try{const raw=localStorage.getItem('psp_'+key);if(raw!==null)return JSON.parse(raw);}catch{}return Object.prototype.hasOwnProperty.call(memoryStore,key)?memoryStore[key]:fallback};
const write=(key,val)=>{memoryStore[key]=val;try{localStorage.setItem('psp_'+key,JSON.stringify(val));}catch{}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setAuthMode(mode){authMode=mode==='register'?'register':'login';document.getElementById('loginTab').classList.toggle('active',authMode==='login');document.getElementById('registerTab').classList.toggle('active',authMode==='register');document.getElementById('registerNameField').classList.toggle('hidden',authMode!=='register');document.getElementById('registerName').required=authMode==='register';document.getElementById('authSubmit').innerHTML=authMode==='register'?'Utwórz konto →':'Zaloguj do systemu →';document.getElementById('authHint').textContent=authMode==='register'?'Utwórz konto służbowe. Nowe konto otrzyma rolę Strażak-Ratownik.':'Zaloguj się przy użyciu przypisanego konta służbowego.';document.getElementById('password').autocomplete=authMode==='register'?'new-password':'current-password';}
function signIn(){let login=document.getElementById('username').value.trim();let password=document.getElementById('password').value;let users=read('users',{});if(!login||!password){toast('Wpisz login i hasło');return;}if(authMode==='register'){let name=document.getElementById('registerName').value.trim();if(!name){toast('Wpisz imię i nazwisko');return;}if(login==='admin'||login==='dyzurny'||Object.prototype.hasOwnProperty.call(users,login)){toast('Ten login jest już zajęty');return;}if(password.length<6){toast('Hasło musi mieć co najmniej 6 znaków');return;}users[login]={name,password,role:'Strażak-Ratownik',blocked:false};write('users',users);toast('Konto utworzone. Możesz się zalogować.');document.getElementById('password').value='';setAuthMode('login');return;}if(!users[login]||users[login].password!==password){toast('Nieprawidłowy login lub hasło');return;}if(users[login].blocked){toast('To konto zostało zablokowane przez administratora');return;}let user=users[login];currentUser={login,name:user.name,role:user.role||'Strażak-Ratownik'};dispatcherLoggedIn=false;document.getElementById('authView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('sideUser').textContent=currentUser.name;document.getElementById('sideRole').textContent=currentUser.role;document.getElementById('topRole').textContent=currentUser.role.toUpperCase();document.getElementById('avatar').textContent=(currentUser.name[0]||'U').toUpperCase();document.querySelector('[data-page="documents"]').classList.toggle('hidden',currentUser.role!=='Administrator');showPage('dashboard');}
document.getElementById('authForm').addEventListener('submit',function(event){event.preventDefault();});
document.getElementById('authSubmit').addEventListener('click',function(event){event.preventDefault();try{signIn();}catch(error){console.error('Błąd logowania/rejestracji:',error);toast('Wystąpił błąd. Sprawdź dane i spróbuj ponownie.');}});
document.getElementById('loginTab').onclick=function(event){event.preventDefault();setAuthMode('login');};
document.getElementById('registerTab').onclick=function(event){event.preventDefault();setAuthMode('register');};
function signOut(){document.getElementById('appView').classList.add('hidden');document.getElementById('authView').classList.remove('hidden');document.getElementById('password').value='';}
function toggleMobileNav(){let side=document.querySelector('.sidebar');side.style.display=side.style.display==='flex'?'none':'flex';side.style.position='fixed';side.style.zIndex='10';side.style.inset='0 auto 0 0';side.style.width='260px';}
document.getElementById('sideNav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)showPage(b.dataset.page)});
function showPage(p){if(p==='documents'&&currentUser.role!=='Administrator'){toast('Rejestr dokumentów jest dostępny tylko dla administratora');p='dashboard';}if((p==='admin'||p==='adminLogin')&&currentUser.role==='Strażak-Ratownik'&&p==='admin')p='dashboard';if(p==='dispatcher'&&!dispatcherLoggedIn)p='dispatcherLogin';page=p;document.querySelectorAll('#sideNav button').forEach(b=>b.classList.toggle('active',b.dataset-page===p));const names={dashboard:'Pulpit / Przegląd',dispatcher:'Panel Dyżurnego / Statusy pojazdów',dispatcherLogin:'Panel Dyżurnego / Logowanie',izz:'Dokumenty / Karta Zdarzenia IZZ',kpp:'Dokumenty / Karta KPP',handover:'Dokumenty / Przekazaniowka',documents:'Dokumenty / Rejestr',admin:'Panel administratora',adminLogin:'Dostęp administracyjny'};document.getElementById('breadcrumb').textContent=names[p]||'KP PSP Sandomierz';render();if(p==='dashboard'&&currentUser.role==='Administrator'){let grid=document.querySelector('#main .module-grid');if(grid&&!document.getElementById('adminModeCard'))grid.insertAdjacentHTML('beforeend',`<article id="adminModeCard" class="module-card" onclick="showPage('admin')"><div class="module-cover"><div class="module-icon">🛡️</div><span class="arrow">↗</span></div><div class="module-body"><h3>Tryb administratora</h3><p>Przejdź do zarządzania kontami, dokumentami i systemem.</p><div class="module-foot"><span>ADMINISTRACJA</span><span>Otwórz panel →</span></div></div></article>`);}}
function pageHead(kicker,title,desc,button=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function stats(){let docs=read('docs',[]), statuses=read('statuses',DEFAULTS);return `<div class="grid stats"><div class="stat"><div class="stat-top">Pojazdy w systemie <span class="stat-icon">🚒</span></div><strong>${VEHICLES.length}</strong><small>Jednostki ujęte w podglądzie</small></div><div class="stat"><div class="stat-top">W bazie <span class="stat-icon">✓</span></div><strong>${VEHICLES.filter(v=>statuses[v.id]==='W BAZIE').length}</strong><small>Gotowe do zadysponowania</small></div><div class="stat"><div class="stat-top">Poza bazą <span class="stat-icon">↗</span></div><strong>${VEHICLES.filter(v=>statuses[v.id]!=='W BAZIE').length}</strong><small>Inny status operacyjny</small></div>${currentUser.role==='Administrator'?`<div class="stat"><div class="stat-top">Zapisane dokumenty <span class="stat-icon">🗂️</span></div><strong>${docs.length}</strong><small>W tym urządzeniu demonstracyjnym</small></div>`:''}</div>`}
function renderDashboard(){let docs=read('docs',[]);return pageHead('CENTRUM DOWODZENIA','Pulpit systemowy','Witaj w centralnym panelu Fikcyjnego PSP. Wybierz moduł, aby rozpocząć pracę.')+stats()+`<div class="section-head"><div><h2>Moduły systemu</h2><p>Dokumentacja oraz obsługa jednostki w jednym miejscu</p></div></div><div class="grid module-grid">${[

function renderDashboard(){let docs=read('docs',[]);let admin=currentUser.role==='Administrator';return pageHead('KOMENDA POWIATOWA PSP','Pulpit systemowy','Witaj w systemie Komendy Powiatowej Państwowej Straży Pożarnej w Sandomierzu. Wybierz moduł, aby rozpocząć pracę.')+stats()+`<div class="section-head"><div><h2>Moduły systemu</h2><p>Dokumentacja oraz obsługa jednostki w jednym miejscu</p></div></div><div class="grid module-grid">${[['dispatcher','📟','Panel Dyżurnego','Statusy pojazdów, ewidencja zdarzeń oraz podgląd gotowości.','OPERACYJNY'],['izz','📋','Karta Zdarzenia IZZ','Dane KDR, zastępy, siły i środki, czasy oraz opis działań.','DOKUMENT'],['kpp','🩺','Karta KPP','Informacje o poszkodowanym, AVPU, SAMPLE i udzielona pomoc.','MEDYCZNY'],['handover','📄','Przekazaniowka','Potwierdzenie przekazania terenu, obiektu lub mienia.','DOKUMENT']].map(m=>`<article class="module-card" onclick="showPage('${m[0]}')"><div class="module-cover"><div class="module-icon">${m[1]}</div><span class="arrow">↗</span></div><div class="module-body"><h3>${m[2]}</h3><p>${m[3]}</p><div class="module-foot"><span>${m[4]}</span><span>Otwórz moduł →</span></div></div></article>`).join('')}</div><div class="grid columns" style="margin-top:22px">${admin?`<section class="panel"><div class="section-head"><div><h2>Ostatnie dokumenty</h2><p>Widoczne tylko dla administratora</p></div><button class="secondary small" onclick="showPage('documents')">Wszystkie →</button></div>${docs.length?`<div class="document-list">${docs.slice(-3).reverse().map(docRow).join('')}</div>`:'<div class="empty">Nie zapisano jeszcze żadnych dokumentów.</div>'}</section>`:''}<section class="panel"><div class="section-head"><div><h2>Status gotowości</h2><p>Bieżący podgląd pojazdów</p></div><button class="secondary small" onclick="showPage('dispatcher')">Zarządzaj</button></div>${VEHICLES.slice(0,4).map(v=>vehicleLine(v,false)).join('')}</section></div><div class="footnote">To jest interaktywny podgląd. Dane zapisywane są wyłącznie w pamięci przeglądarki na tym urządzeniu. Prawdziwe konta, role i synchronizacja pomiędzy użytkownikami wymagają podłączenia backendu.</div>`}
function statusClass(s){return s==='W BAZIE'?'':s==='CZASOWO WYŁĄCZONY Z PODZIAŁU'?'bad':'warn'}
function vehicleLine(v,editable=true){let st=read('statuses',DEFAULTS)[v.id]||'W BAZIE';return `<div class="vehicle-row"><div><div class="vehicle-name">${v.id} · ${v.name}</div><div class="vehicle-sub"><span class="status-pill ${statusClass(st)}">${esc(st)}</span></div></div>${editable?`<div class="vehicle-controls"><select aria-label="Status ${v.id}" onchange="changeStatus('${v.id}',this.value)">${STATUS.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></div>`:''}</div>`}
function changeStatus(id,status){let s=read('statuses',DEFAULTS);const previous=s[id]||'W BAZIE';if(previous===status)return;s[id]=status;write('statuses',s);let hist=read('statusHistory',[]);const change={id,status,previous,by:currentUser.name,at:new Date().toLocaleString('pl-PL')};hist.unshift(change);write('statusHistory',hist.slice(0,40));sendStatusChangeToDiscord(change);render();toast('Zmieniono status pojazdu '+id);}
async function postDiscordWebhook(webhook,payload){if(!webhook)throw new Error('Brak skonfigurowanego webhooka Discord');const separator=webhook.includes('?')?'&':'?';const response=await fetch(webhook+separator+'wait=true',{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok){let detail='';try{detail=await response.text();}catch{}throw new Error('Discord HTTP '+response.status+(detail?' — '+detail.slice(0,250):''));}return response;}
async function sendStatusChangeToDiscord(change){const webhook=DISCORD_WEBHOOKS['EWID-ST'];const payload={username:'KP PSP Sandomierz · Dyspozycja',allowed_mentions:{parse:[]},embeds:[{title:'🚒 Zmiana statusu pojazdu',color:11801627,fields:[{name:'Pojazd',value:String(change.id),inline:true},{name:'Poprzedni status',value:String(change.previous||'Nieznany'),inline:true},{name:'Nowy status',value:String(change.status),inline:false},{name:'Zmienił',value:String(change.by||'Nieznany'),inline:true},{name:'Data i godzina',value:String(change.at||new Date().toLocaleString('pl-PL')),inline:true}],footer:{text:'KP PSP Sandomierz · Panel Dyżurnego'}}]};try{await postDiscordWebhook(webhook,payload);toast('Zmiana statusu wysłana na Discord');}catch(error){console.error('Błąd wysyłki zmiany statusu na Discord:',error);toast('Status zapisany, ale wysyłka na Discord nie działa — sprawdź webhook');}}
function renderDispatcherLogin(){return pageHead('DOSTĘP SŁUŻBOWY','Logowanie Dyżurnego','Ten panel wymaga osobnego loginu i hasła.')+`<section class="panel form-panel"><form id="dispatcherAuthForm"><div class="field"><label for="dispatcherLoginInput">LOGIN DYŻURNEGO</label><input id="dispatcherLoginInput" name="dispatcherLogin" autocomplete="username" required placeholder="Wpisz login dyżurnego"></div><div class="field"><label for="dispatcherPasswordInput">HASŁO</label><input id="dispatcherPasswordInput" name="dispatcherPassword" type="password" autocomplete="current-password" required placeholder="Wpisz hasło"></div><div class="form-actions"><button type="button" class="secondary" id="dispatcherBackButton">Wróć</button><button class="primary" id="dispatcherLoginButton" type="button">Zaloguj do Panelu Dyżurnego →</button></div></form></section>`}
function loginDispatcher(){const login=document.getElementById('dispatcherLoginInput').value.trim();const password=document.getElementById('dispatcherPasswordInput').value;if(login==='dyzurny'&&password==='PSP2026!'){dispatcherLoggedIn=true;showPage('dispatcher');toast('Zalogowano do Panelu Dyżurnego');}else toast('Nieprawidłowy login lub hasło dyżurnego');}
function logoutDispatcher(){dispatcherLoggedIn=false;showPage('dashboard');toast('Wylogowano z Panelu Dyżurnego');}
function renderDispatcher(){let hist=read('statusHistory',[]);return pageHead('DYSPONOWANIE','Panel Dyżurnego','Zarządzaj statusami pojazdów oraz przygotuj wpis EWID-ST.',`<button class="secondary" onclick="logoutDispatcher()">Wyloguj dyżurnego</button>`)+`<div class="notice">Każda zmiana statusu pojazdu jest wysyłana na Discord. Statusy i historia w tej wersji nadal zapisują się lokalnie w tej przeglądarce.</div><div class="grid columns"><section class="panel"><div class="section-head"><div><h2>Status pojazdów</h2><p>${VEHICLES.length} pojazdów w wykazie</p></div><span class="tag red">LIVE</span></div><div class="vehicle-list">${VEHICLES.map(v=>vehicleLine(v,true)).join('')}</div></section><section class="panel"><div class="section-head"><div><h2>EWID-ST</h2><p>Podstawowe dane zdarzenia</p></div></div><form onsubmit="saveForm(event,'EWID-ST')"><div class="field"><label>RODZAJ ZDARZENIA</label><select name="Rodzaj zdarzenia" required><option value="">Wybierz</option><option>P — Pożar</option><option>MZ — Miejscowe zagrożenie</option><option>AF — Alarm fałszywy</option><option>ĆW — Ćwiczenia</option><option>PnZR</option><option>WG/A</option></select></div><div class="field"><label>MIEJSCE ZDARZENIA</label><input name="Miejsce zdarzenia" required placeholder="Miejscowość, ulica"></div><div class="field"><label>POJAZDY ZADYSPONOWANE</label><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">${VEHICLES.map(v=>`<label style="font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center"><input type="checkbox" name="Pojazdy" value="${v.id}" style="width:auto">${v.id}</label>`).join('')}</div></div><div class="field"><label>OPIS / INFORMACJE DODATKOWE</label><textarea name="Opis" placeholder="Dodatkowe informacje"></textarea></div><div class="form-actions"><button class="primary" type="submit">Zapisz EWID-ST</button></div></form></section></div><section class="panel" style="margin-top:16px"><div class="section-head"><div><h2>Historia zmian statusów</h2><p>Ostatnie aktualizacje</p></div></div>${hist.length?`<div class="document-list">${hist.slice(0,8).map(h=>`<div class="doc-row"><div><strong>${esc(h.id)} — ${esc(h.status)}</strong><small>${esc(h.by)} · ${esc(h.at)}</small></div></div>`).join('')}</div>`:'<div class="empty">Brak zmian statusów.</div>'}</section>`}
function renderIzz(){return pageHead('DOKUMENTACJA ZDARZENIA','Karta Zdarzenia IZZ','Uzupełnij dane działań ratowniczych i zapisz dokument w rejestrze.')+`<section class="panel form-panel"><div class="notice">Po zapisaniu dokument zostanie dodany do lokalnego rejestru i wysłany na skonfigurowany webhook Discord. Możesz zaznaczyć kilka zastępów jednocześnie.</div><form onsubmit="saveForm(event,'Karta Zdarzenia IZZ')"><div class="form-grid"><div class="field"><label>IMIĘ I NAZWISKO KDR</label><input name="KDR" required placeholder="Imię i nazwisko"></div><div class="field"><label>FUNKCJA</label><select name="Funkcja KDR"><option>Dowódca zastępu</option><option>Kierujący działaniami ratowniczymi</option><option>Oficer operacyjny</option></select></div><div class="field"><label>KATEGORIA ZDARZENIA</label><select name="Kategoria"><option>Pożar</option><option>Miejscowe zagrożenie</option><option>Alarm fałszywy</option><option>Ćwiczenia</option><option>Inne</option></select></div><div class="field"><label>WIELKOŚĆ ZDARZENIA</label><select name="Wielkość"><option>Małe</option><option>Średnie</option><option>Duże</option><option>Bardzo duże</option></select></div><div class="field"><label>LOKALIZACJA</label><input name="Lokalizacja" required placeholder="Miejscowość, ulica"></div><div class="field span2"><label>POJAZDY / ZASTĘPY (MOŻNA WYBRAĆ KILKA)</label><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${VEHICLES.map(v=>`<label style="font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center"><input type="checkbox" name="Zastęp" value="${v.id} — ${v.name}" style="width:auto">${v.id} — ${v.name}</label>`).join('')}</div></div><div class="field"><label>PRZYBYCIE</label><input type="datetime-local" name="Przybycie"></div><div class="field"><label>ZAKOŃCZENIE DZIAŁAŃ</label><input type="datetime-local" name="Zakończenie"></div><div class="field span2"><label>OBSADA ZASTĘPÓW</label><input name="Obsada" placeholder="Imiona i nazwiska ratowników"></div><div class="field span2"><label>SIŁY I ŚRODKI / DODATKOWE JEDNOSTKI</label><textarea name="Siły i środki" placeholder="Wpisz zadysponowane siły i środki"></textarea></div><div class="field span2"><label>OPIS ZDARZENIA I DZIAŁAŃ</label><textarea name="Opis zdarzenia" required placeholder="Przebieg i wykonane czynności..."></textarea></div><div class="field span2"><label>OSOBA SPORZĄDZAJĄCA</label><input name="Osoba sporządzająca" value="${esc(currentUser.name)}"></div></div><div class="form-actions"><button type="button" class="secondary" onclick="showPage('dashboard')">Anuluj</button><button class="primary" type="submit">Zapisz kartę</button></div></form></section>`}
function renderKpp(){return pageHead('RATOWNICTWO MEDYCZNE','Karta KPP','Dokumentacja udzielonej kwalifikowanej pierwszej pomocy.')+`<section class="panel form-panel"><div class="notice">Wpisuj tylko dane potrzebne do dokumentacji. Ten demonstracyjny formularz nie jest certyfikowanym systemem medycznym.</div><form onsubmit="saveForm(event,'Karta KPP')"><div class="form-grid"><div class="field"><label>DATA I MIEJSCE ZDARZENIA</label><input name="Data i miejsce zdarzenia" required placeholder="Data, miejscowość, ulica"></div><div class="field"><label>RATOWNIK</label><input name="Ratownik" value="${esc(currentUser.name)}" required></div><div class="field"><label>PŁEĆ</label><select name="Płeć"><option>Nieustalona</option><option>Kobieta</option><option>Mężczyzna</option></select></div><div class="field"><label>DATA URODZENIA</label><input type="date" name="Data urodzenia"></div><div class="field"><label>NAZWISKO</label><input name="Nazwisko"></div><div class="field"><label>IMIĘ</label><input name="Imię"></div><div class="field"><label>AVPU</label><select name="AVPU"><option>Nie wybrano</option><option>A — przytomny</option><option>V — reaguje na głos</option><option>P — reaguje na ból</option><option>U — nieprzytomny</option></select></div><div class="field"><label>SpO₂ (%)</label><input type="number" name="SpO2" min="0" max="100"></div><div class="field"><label>TĘTNO (/min)</label><input type="number" name="Tętno" min="0"></div><div class="field"><label>ODDECH (/min)</label><input type="number" name="Oddech" min="0"></div><div class="field span2"><label>WYWIAD SAMPLE</label><textarea name="Wywiad SAMPLE" placeholder="S — objawy; A — alergie; M — leki; P — przebyte choroby; L — posiłek; E — opis zdarzenia"></textarea></div><div class="field span2"><label>ABC, OBRAŻENIA I OBJAWY</label><textarea name="ABC, obrażenia i objawy" placeholder="Drożność dróg oddechowych, oddech, krążenie, obrażenia, objawy"></textarea></div><div class="field span2"><label>UDZIELONA POMOC / PO function renderHandover(){return pageHead('PRZEKAZANIE MIENIA','Przekazaniowka','Potwierdzenie przekazania terenu, obiektu lub mienia objętego działaniami ratowniczymi.')+`<section class="panel form-panel"><form onsubmit="saveForm(event,'Przekazaniowka')"><div class="form-grid"><div class="field"><label>MIEJSCE ZDARZENIA</label><input name="Miejsce zdarzenia" required></div><div class="field"><label>DATA I GODZINA</label><input type="datetime-local" name="Data i godzina"></div><div class="field"><label>RODZAJ PRZEKAZANIA</label><select name="Rodzaj przekazania"><option>Teren</option><option>Obiekt</option><option>Mienie</option><option>Teren, obiekt i mienie</option><option>Inne</option></select></div><div class="field"><label>MIEJSCOWOŚĆ</label><input name="Miejscowość"></div><div class="field span2"><label>OPIS PRZEKAZYWANEGO TERENU / OBIEKTU / MIENIA</label><textarea name="Opis" required></textarea></div><div class="field span2"><label>UWAGI</label><textarea name="Uwagi"></textarea></div><div class="field"><label>PRZEKAZUJĄCY</label><input name="Osoba przekazująca" required></div><div class="field"><label>PRZYJMUJĄCY</label><input name="Osoba przyjmująca" required></div><div class="field"><label>DATA SPORZĄDZENIA</label><input type="date" name="Data sporządzenia"></div><div class="field"><label>PODPISY / POTWIERDZENIE</label><input name="Potwierdzenie" placeholder="Podpisy / uwagi"></div></div><div class="form-actions"><button type="button" class="secondary" onclick="showPage('dashboard')">Anuluj</button><button class="primary" type="submit">Zapisz przekazanie</button></div></form></section>`}
function docRow(d){return `<div class="doc-row"><div><strong>${esc(d.type)}${d.fields?.['Miejsce zdarzenia']?' — '+esc(d.fields['Miejsce zdarzenia']):d.fields?.['Lokalizacja']?' — '+esc(d.fields['Lokalizacja']):''}</strong><small>${esc(d.date)} · ${esc(d.author)}</small></div><button class="secondary small" onclick="viewDoc('${d.id}')">Podgląd</button></div>`}
function renderDocuments(){let docs=read('docs',[]);return pageHead('ARCHIWUM','Dokumenty','Rejestr dokumentów zapisanych w tym demonstracyjnym podglądzie.')+`<section class="panel"><div class="section-head"><div><h2>Rejestr dokumentów</h2><p>${docs.length} zapisanych pozycji</p></div><input class="search" style="max-width:240px" placeholder="Szukaj dokumentu…" oninput="filterDocs(this.value)"></div><div id="docList">${docs.length?docs.slice().reverse().map(docRow).join(''):'<div class="empty">Brak dokumentów. Utwórz kartę w jednym z modułów.</div>'}</div><div class="footnote">Dokumenty są przechowywane lokalnie w tej przeglądarce. Nie wpisuj prawdziwych danych osobowych ani medycznych do podglądu.</div></section>`}
function filterDocs(q){let docs=read('docs',[]).slice().reverse().filter(d=>(d.type+' '+d.author+' '+JSON.stringify(d.fields)).toLowerCase().includes(q.toLowerCase()));document.getElementById('docList').innerHTML=docs.length?docs.map(docRow).join(''):'<div class="empty">Brak wyników.</div>'}
function viewDoc(id){let d=read('docs',[]).find(x=>x.id===id);if(!d)return;let body=Object.entries(d.fields).map(([k,v])=>`<div class="doc-row"><div><strong>${esc(k)}</strong><small style="white-space:pre-wrap">${esc(v||'—')}</small></div></div>`).join('');document.getElementById('main').innerHTML=pageHead('ARCHIWUM',esc(d.type),'Szczegóły zapisanego dokumentu.',`<button class="secondary" onclick="showPage('documents')">← Wróć do dokumentów</button>`)+`<section class="panel"><div class="notice">Utworzono: ${esc(d.date)} · Autor: ${esc(d.author)}</div><div class="document-list">${body}</div><div class="form-actions"><button class="secondary" onclick="window.print()">Drukuj</button><button class="danger" onclick="deleteDoc('${d.id}')">Usuń dokument</button></div></section>`}
function deleteDoc(id){if(!confirm('Usunąć ten dokument z lokalnego rejestru?'))return;write('docs',read('docs',[]).filter(d=>d.id!==id));showPage('documents');toast('Usunięto dokument');}
async function sendDocumentToDiscord(doc){const webhook=DISCORD_WEBHOOKS[doc.type];if(!webhook){console.warn('Brak webhooka dla typu dokumentu:',doc.type);toast('Dokument zapisany lokalnie — brak webhooka dla tego dokumentu');return;}const fields=Object.entries(doc.fields||{}).filter(([name,value])=>String(value??'').trim()).slice(0,23).map(([name,value])=>({name:String(name).slice(0,256),value:String(value).slice(0,1024)||'—',inline:false}));const payload={username:'KP PSP Sandomierz · Dokumentacja',allowed_mentions:{parse:[]},embeds:[{title:'📄 '+String(doc.type).slice(0,240),color:11801627,description:'Nowy dokument zapisany w systemie Komendy Powiatowej Państwowej Straży Pożarnej w Sandomierzu.',fields:[{name:'Autor',value:String(doc.author||'Nie podano').slice(0,1024),inline:true},{name:'Data utworzenia',value:String(doc.date||'Nie podano').slice(0,1024),inline:true},...fields].slice(0,25),footer:{text:'KP PSP Sandomierz · Panel systemowy'}}]};try{await postDiscordWebhook(webhook,payload);toast('Dokument zapisany i wysłany na Discord');}catch(error){console.error('Błąd wysyłki webhooka Discord:',error);toast('Zapisano lokalnie, ale wysyłka Discord nie powiodła się — sprawdź webhook');}}
function saveForm(e,type){e.preventDefault();let form=e.target,fields={};new FormData(form).forEach((v,k)=>{if(fields[k])fields[k]+=', '+v;else fields[k]=v});let docs=read('docs',[]);const doc={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type,fields,author:currentUser.name,date:new Date().toLocaleString('pl-PL')};docs.push(doc);write('docs',docs);showPage(currentUser.role==='Administrator'?'documents':'dashboard');sendDocumentToDiscord(doc);}
function renderAdminLogin(){return pageHead('DOSTĘP ADMINISTRACYJNY','Panel administratora','Osobny dostęp do zarządzania kontami i dokumentami.')+`<section class="panel form-panel"><form id="adminAuthForm"><div class="field"><label>LOGIN ADMINISTRATORA</label><input id="adminLoginInput" required autocomplete="username"></div><div class="field"><label>HASŁO</label><input id="adminPasswordInput" type="password" required autocomplete="current-password"></div><div class="form-actions"><button type="button" class="secondary" onclick="showPage('dashboard')">Wróć</button><button type="submit" class="primary">Zaloguj jako administrator →</button></div></form></section>`}
function loginAdmin(e){if(e)e.preventDefault();if(document.getElementById('adminLoginInput').value.trim()==='admin'&&document.getElementById('adminPasswordInput').value==='PSPADMIN2026!'){currentUser={login:'admin',name:'Administrator systemu',role:'Administrator'};dispatcherLoggedIn=false;document.getElementById('sideUser').textContent=currentUser.name;document.getElementById('sideRole').textContent=currentUser.role;document.getElementById('topRole').textContent='ADMINISTRATOR';document.getElementById('avatar').textContent='A';document.querySelector('[data-page="documents"]').classList.remove('hidden');showPage('admin');toast('Zalogowano do panelu administratora');}else toast('Nieprawidłowe dane administratora');}
function renderAdmin(){if(currentUser.role!=='Administrator')return pageHead('BRAK DOSTĘPU','Odmowa dostępu','To miejsce jest dostępne wyłącznie dla administratora.')+`<button class="secondary" onclick="showPage('dashboard')">Wróć na pulpit</button>`;let users=read('users',{}),docs=read('docs',[]),accounts=Object.entries(users);return pageHead('ZARZĄDZANIE SYSTEMEM','Panel administratora','Ukryty moduł administracyjny — konta, dokumenty i ustawienia.')+`<div class="grid stats"><div class="stat"><div class="stat-top">Konta użytkowników <span class="stat-icon">👥</span></div><strong>${accounts.length}</strong><small>Zarejestrowane konta</small></div><div class="stat"><div class="stat-top">Dokumenty <span class="stat-icon">🗂️</span></div><strong>${docs.length}</strong><small>W lokalnym rejestrze</small></div><div class="stat"><div class="stat-top">Pojazdy <span class="stat-icon">🚒</span></div><strong>${VEHICLES.length}</strong><small>Wykaz jednostki</small></div><div class="stat"><div class="stat-top">Uprawnienia <span class="stat-icon">🛡️</span></div><strong>ADMIN</strong><small>Pełny dostęp demonstracyjny</small></div></div><section class="panel"><div class="section-head"><div><h2>Użytkownicy</h2><p>Zmieniaj role, blokuj i usuwaj konta w tej przeglądarce</p></div></div>${accounts.length?`<div class="document-list">${accounts.map(([login,u])=>`<div class="doc-row"><div style="min-width:0"><strong>${esc(u.name)} · ${esc(login)}</strong><small>${u.blocked?'KONTO ZABLOKOWANE':'Konto aktywne'} · ${esc(u.role||'Strażak-Ratownik')}</small></div><div class="vehicle-controls"><select aria-label="Rola ${esc(login)}" onchange="setUserRole('${encodeURIComponent(login)}',this.value)"><option ${(!u.role||u.role==='Strażak-Ratownik')?'selected':''}>Strażak-Ratownik</option><option ${u.role==='Dyżurny'?'selected':''}>Dyżurny</option><option ${u.role==='Administrator'?'selected':''}>Administrator</option></select><button class="${u.blocked?'primary':'danger'} small" onclick="toggleUserBlock('${encodeURIComponent(login)}')">${u.blocked?'Odblokuj':'Zablokuj'}</button><button class="danger small" onclick="deleteUser('${encodeURIComponent(login)}')">Usuń konto</button></div></div>`).join('')}</div>`:'<div class="empty">Nie ma jeszcze kont użytkowników.</div>'}</section><section class="panel" style="margin-top:16px"><div class="section-head"><div><h2>Ostatnie dokumenty</h2><p>Podgląd wpisów utworzonych w tym urządzeniu</p></div><button class="secondary small" onclick="showPage('documents')">Otwórz rejestr</button></div>${docs.length?`<div class="document-list">${docs.slice(-8).reverse().map(docRow).join('')}</div>`:'<div class="empty">Brak dokumentów.</div>'}</section><div class="footnote">Panel jest ukryty w zwykłym menu, ale w tej wersji to tylko demonstracja. Role, konta i dane są przechowywane w przeglądarce i można je zmienić po stronie klienta.</div>`}
function setUserRole(encodedLogin,role){if(currentUser.role!=='Administrator'){toast('Brak uprawnień');return;}let login=decodeURIComponent(encodedLogin),users=read('users',{});if(!users[login])return;users[login].role=role;write('users',users);let audit=read('adminLog',[]);audit.unshift({action:'Zmiana roli: '+login+' → '+role,by:currentUser.name,at:new Date().toLocaleString('pl-PL')});write('adminLog',audit.slice(0,100));render();toast('Zmieniono rolę użytkownika');}
function toggleUserBlock(encodedLogin){if(currentUser.role!=='Administrator'){toast('Brak uprawnień');return;}let login=decodeURIComponent(encodedLogin),users=read('users',{});if(!users[login])return;users[login].blocked=!users[login].blocked;write('users',users);let audit=read('adminLog',[]);audit.unshift({action:(users[login].blocked?'Zablokowano konto: ':'Odblokowano konto: ')+login,by:currentUser.name,at:new Date().toLocaleString('pl-PL')});write('adminLog',audit.slice(0,100));render();toast(users[login].blocked?'Zablokowano konto':'Odblokowano konto');}
let pendingDeleteUser=null;
function deleteUser(encodedLogin){if(currentUser.role!=='Administrator'){toast('Brak uprawnień');return;}let login;try{login=decodeURIComponent(encodedLogin);}catch{login=encodedLogin;}if(login==='admin'||login===currentUser.login){toast('Nie można usunąć aktywnego konta administratora');return;}let users=read('users',{});if(!Object.prototype.hasOwnProperty.call(users,login)){toast('Nie znaleziono tego konta — odśwież panel');return;}if(pendingDeleteUser!==login){pendingDeleteUser=login;toast('Kliknij „Usuń konto” ponownie, aby potwierdzić: '+login);return;}pendingDeleteUser=null;delete users[login];write('users',users);let audit=read('adminLog',[]);audit.unshift({action:'Usunięto konto: '+login,by:currentUser.name,at:new Date().toLocaleString('pl-PL')});write('adminLog',audit.slice(0,100));showPage('admin');toast('Usunięto konto '+login);}
function openHiddenAdmin(){if(document.getElementById('appView').classList.contains('hidden')){toast('Najpierw zaloguj się do systemu');return;}showPage('adminLogin');}
document.addEventListener('click',event=>{if(event.target.closest('#adminAuthForm button[type="submit"]')){event.preventDefault();loginAdmin();}},true);
document.addEventListener('keydown',event=>{if(event.ctrlKey&&event.shiftKey&&event.key.toLowerCase()==='a'){event.preventDefault();openHiddenAdmin();}});
function viewDoc(id){if(currentUser.role!=='Administrator'){toast('Dokumenty są dostępne tylko dla administratora');showPage('dashboard');return;}let d=read('docs',[]).find(x=>x.id===id);if(!d)return;let body=Object.entries(d.fields).map(([k,v])=>`<div class="doc-row"><div><strong>${esc(k)}</strong><small style="white-space:pre-wrap">${esc(v||'—')}</small></div></div>`).join('');document.getElementById('main').innerHTML=pageHead('ARCHIWUM',esc(d.type),'Szczegóły zapisanego dokumentu.',`<button class="secondary" onclick="showPage('documents')">← Wróć do dokumentów</button>`)+`<section class="panel"><div class="notice">Utworzono: ${esc(d.date)} · Autor: ${esc(d.author)}</div><div class="document-list">${body}</div><div class="form-actions"><button class="secondary" onclick="window.print()">Drukuj</button><button class="danger" onclick="deleteDoc('${d.id}')">Usuń dokument</button></div></section>`}
function deleteDoc(id){if(currentUser.role!=='Administrator'){toast('Brak uprawnień do dokumentów');showPage('dashboard');return;}if(!confirm('Usunąć ten dokument z lokalnego rejestru?'))return;write('docs',read('docs',[]).filter(d=>d.id!==id));showPage('documents');toast('Usunięto dokument');}
function render(){let main=document.getElementById('main');const pages={dashboard:renderDashboard,dispatcher:renderDispatcher,dispatcherLogin:renderDispatcherLogin,izz:renderIzz,kpp:renderKpp,handover:renderHandover,documents:renderDocuments,adminLogin:renderAdminLogin,admin:renderAdmin};main.innerHTML=(pages[page]||renderDashboard)();main.querySelectorAll('form').forEach(form=>{const handler=form.getAttribute('onsubmit')||'';const match=handler.match(/saveForm\(event,\s*'([^']+)'\)/);if(match){form.dataset.saveType=match[1];form.removeAttribute('onsubmit');form.addEventListener('submit',event=>{event.preventDefault();saveForm(event,form.dataset.saveType);});}else if(form.id==='dispatcherAuthForm'){form.addEventListener('submit',event=>{event.preventDefault();loginDispatcher();});}else if(form.id==='adminAuthForm'){form.addEventListener('submit',loginAdmin);}});main.querySelectorAll('button[type="submit"]').forEach(button=>button.addEventListener('click',event=>{const form=button.closest('form');if(!form)return;event.preventDefault();if(!form.checkValidity()){form.reportValidity();return;}const type=form.dataset.saveType;if(type)saveForm({preventDefault(){},target:form},type);}));const loginButton=document.getElementById('dispatcherLoginButton');if(loginButton)loginButton.addEventListener('click',loginDispatcher);const backButton=document.getElementById('dispatcherBackButton');if(backButton)backButton.addEventListener('click',()=>showPage('dashboard'));}
let toastTimer;function toast(msg){let t=document.getElementById('toast');t.textContent='✓  '+msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
</script>
<script>
// Utrudnienie przypadkowego otwarcia narzędzi deweloperskich — nie jest to zabezpieczenie kodu.
document.addEventListener('contextmenu', function(event) {
  event.preventDefault();
});
document.addEventListener('keydown', function(event) {
  const key = (event.key || '').toLowerCase();
  if (key === 'f12' ||
      (event.ctrlKey && event.shiftKey && ['i', 'j', 'c'].includes(key)) ||
      (event.ctrlKey && key === 'u')) {
    event.preventDefault();
    event.stopPropagation();
  }
});
</script>
